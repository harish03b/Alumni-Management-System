<!-- amount.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Association - Donation Form</title>
    <style>
       /* Reset & Base Styles */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f8f8f8;
}

/* Navbar Styling */
header {
    background-color: #003366;
    padding: 20px 0;
}

header h1 {
    color: orange;
    font-size: 32px;
    font-weight: bold;
    margin: 0;
    padding-left: 30px;
}

nav {
    background-color: #003366;
    display: flex;
    justify-content: flex-end;
    padding: 10px 30px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 30px;
    font-size: 18px;
}

nav a:hover {
    text-decoration: underline;
}

/* Page Layout */
.container {
    width: 100%;
}

/* Main Content Styling */
main {
    width: 90%;
    max-width: 700px;
    margin: 30px auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    text-align: center;
}

/* Heading */
main h2 {
    background: linear-gradient(to bottom, #daa520, #8b6c3c);
    color: white;
    font-size: 26px;
    font-weight: bold;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 30px;
}

/* Donation Option Boxes */
.donation-options {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
}

.donation-option {
    background-color: #003366;
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s;
    min-width: 100px;
    text-align: center;
}

.donation-option:hover,
.donation-option.active {
    background-color: #0051a1;
}

/* Custom Amount Input */
#customAmount {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-top: 15px;
}

/* Next Button */
#nextButton {
    width: 100%;
    padding: 12px;
    background-color: #003366;
    color: white;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 20px;
}

#nextButton:hover {
    background-color: #002244;
}

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Alumni Association</h1>
        </header>
        <nav>
            <a href="alumini.html">Home</a>
            <a href="#">Directory</a>
            <a href="#">Contact</a>
            <a href="#">Event</a>
        </nav>
        <main>
            <h2>Choose Donation Amount</h2>
            <div class="donation-options">
                <div class="donation-option" data-amount="500">₹500</div>
                <div class="donation-option" data-amount="200">₹200</div>
                <div class="donation-option" data-amount="100">₹100</div>
                <div class="donation-option" data-amount="1000">₹1000</div>
                <div class="donation-option" data-amount="2000">₹2000</div>
            </div>
            <input type="text" id="customAmount" placeholder="Custom Amount">
            <button id="nextButton">Next</button>
        </main>

        <script>
            let selectedAmount = null;
        
            const options = document.querySelectorAll('.donation-option');
            const customAmountInput = document.getElementById('customAmount');
            const nextButton = document.getElementById('nextButton');
        
            // Handle preset donation option clicks
            options.forEach(option => {
                option.addEventListener('click', () => {
                    // Remove active class from all options
                    options.forEach(opt => opt.classList.remove('active'));
        
                    // Add active class to clicked option
                    option.classList.add('active');
        
                    // Set selected amount from the clicked option
                    selectedAmount = option.getAttribute('data-amount');
        
                    // Update custom input to reflect selected amount
                    customAmountInput.value = selectedAmount;
                });
            });
        
            // Handle Next button click
            nextButton.addEventListener('click', () => {
                const customValue = customAmountInput.value.trim();
        
                // If custom amount entered, use it as selectedAmount
                if (customValue) {
                    selectedAmount = customValue;
                }
        
                if (!selectedAmount || isNaN(selectedAmount) || Number(selectedAmount) <= 0) {
                    alert('Please select or enter a valid donation amount');
                    return;
                }
        
                // Store selected amount
                localStorage.setItem('donationAmount', selectedAmount);
        
                // Redirect to payment page
                window.location.href = 'payment.html';
            });
        </script>
        
    </div>
</body>
</html>
