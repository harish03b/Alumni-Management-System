    <main class="Container">
        <section class="search-form-section">
            <h2 class="title">Search Jobs by Location or Company</h2>
            <form id="location-search-form" action="/search" method="post">
                <div class="search-group">
                    <label for="locationsearch">Search by Location:</label>
                    <input type="text" id="locationsearch" name="locationsearch" placeholder="Enter city, state, or country">
                </div>
            
                <div class="search-group">
                    <label for="companysearch">Search by Company:</label>
                    <input type="text" id="companysearch" name="companysearch" placeholder="Enter company name">
                </div>
            
                <button type="submit" class="search-btn">Search</button>
            </form>
             <div class="container">

                    <th>Last Name</th>
                    <th>User Type</th>
                    <th>Email</th>
                    <th>Address</th>
                </tr>
            </thead>
            <tbody id="all-users" ></tbody>
        </table>
    </div>
