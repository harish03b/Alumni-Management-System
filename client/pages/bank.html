
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Transfer Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .image-placeholder {
            width: 100%;
            height: 200px;
            background-color: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #999;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #666;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .button-group {
            margin-top: 20px;
            text-align: center;
        }
        .button {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .verify {
            background-color: #4CAF50;
            color: white;
        }
        .pay {
            background-color: #008CBA;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bank Transfer</h1>
        <div class="image-placeholder">Image</div>
        <form>
            <label for="bankName">Bank Name:</label>
            <input type="text" id="bankName" name="bankName" required>
            
            <label for="accountDetails">Account Details:</label>
            <input type="text" id="accountDetails" name="accountDetails" required>
            
            <label for="ifsc">IFSC:</label>
            <input type="text" id="ifsc" name="ifsc" required>
            
            <label for="screenshot">Upload Screenshot:</label>
            <input type="file" id="screenshot" name="screenshot" accept="image/*">
            
            <div class="button-group">
                <button type="button" class="button verify">Verify</button>
                <li>
                    <a href="donation.html" class="button pay">Pay</a>
                </li>
            </div>
        </form>
    </div>
</body>
</html>
