<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Alumni Association</title>
  <link rel="stylesheet" href="login.css" />
  
</head>
<body>
  <header>
    <div class="container">
      <div class="branding">
        <h1><span class="highlight">Alumni</span> Association</h1>
      </div>
      <nav>
        <ul>
          <li><a href="alumini.html">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#">Events</a></li>
          <li><img src="User_Profile.png" alt="profile"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-switch">
      <div class="toggle-button">
        <div class="switch-text login active" id="loginText">Login</div>
        <div class="switch-text signup" id="signupText">Signup</div>
        <div class="switch-button" id="switchButton"></div>
      </div>
    </div>

    <section class="login-section">
      <div class="container">
        <div class="login-form-container">
          <h2>Login</h2>
          <form action="/login" method="post">
            <div class="form-group">
              <label for="username">Username/Mobile no.</label>
              <input type="text" id="username" name="username" required />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="form-group checkbox">
              <input type="checkbox" id="remember" name="remember" />
              <label for="remember">Remember me</label>
            </div>
            <div class="form-group">
              <button type="submit">Login</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Alumni Association Platform. All rights reserved.</p>
  </footer>

  <script src="login_singup.js"></script>
</body>
</html>
