<!-- donation.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Association - Donor Information</title>
    <style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f8f8f8;
}

/* Navbar */
.navbar {
    width: 100%;
    background-color: #003366;
    padding: 20px 0;
}

.nav-container {
    max-width: 1200px;
    margin: auto;
    padding: 0 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: orange;
    font-size: 32px;
    font-weight: bold;
    margin: 0;
}

.nav-links a {
    color: white;
    margin-left: 30px;
    text-decoration: none;
    font-size: 18px;
}

.nav-links a:hover {
    text-decoration: underline;
}

/* Title Bar (like "Networking and Career") */
.page-title {
    width: 90%;
    max-width: 600px;
    margin: 20px auto;
    background: linear-gradient(to bottom, #daa520, #8b6c3c);
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 26px;
    font-weight: bold;
    border-radius: 10px;
}

/* Donation Form Styling */
.form-container {
    width: 90%;
    max-width: 600px;
    margin: 30px auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

form input {
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

.next-button {
    width: 100%;
    padding: 12px;
    background-color: #003366;
    color: white;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
}

.next-button:hover {
    background-color: #002244;
}


    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">Alumni Association</h1>
            <nav class="nav-links">
                <a href="alumini.html">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
                <a href="#">Events</a>
            </nav>
        </div>
    </header>
    
    <!-- Title bar styled like your image -->
    <div class="page-title">Donation Form</div>
    
    <div class="form-container">
        <form id="donorForm" action="donate" method="post">
            <input type="text" name="firstName" placeholder="First Name" required>
            <input type="text" name="lastName" placeholder="Last Name" required>
            <input type="email" name="email" placeholder="Email ID" required>
            <button class="next-button" type="submit">Next</button>
        </form>
    </div>
    

    <script>
        document.getElementById('donorForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent form submission

            const formData = new FormData(this);

            // Store donor information in localStorage to use later
            localStorage.setItem('firstName', formData.get('firstName'));
            localStorage.setItem('lastName', formData.get('lastName'));
            localStorage.setItem('email', formData.get('email'));

            // Redirect to the amount selection page
            window.location.href = 'amount.html';
        });
    </script>
</body>
</html>
