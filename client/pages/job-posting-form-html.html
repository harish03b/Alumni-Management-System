<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job</title>
   <link rel="stylesheet" href="job-posting-form-css.css">
</head>
<body>
    <header>
        <h1 class="aa">Alumni Association</h1>
        <nav>
            <ul>
                <li><a href="alumini.html">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Events</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="form-section">
            <h2 class="title">Post a Job</h2>
            <form id="job-posting-form" action="/postjob" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <h3>Job Information</h3>
                    <label for="jobTitle">Job Title:</label>
                    <input type="text" id="jobTitle" name="jobTitle" required>

                    <label for="companyName">Company Name:</label>
                    <input type="text" id="companyName" name="companyName" required>

                    <label for="jobLocation">Job Location:</label>
                    <input type="text" id="jobLocation" name="jobLocation" required>
                </div>

                <div class="form-group">
                    <h3>Job Details</h3>
                    <label for="jobDescription">Job Description:</label>
                    <textarea id="jobDescription" name="jobDescription" rows="4" required></textarea>

                    <label for="qualifications">Qualifications:</label>
                    <textarea id="qualifications" name="qualifications" rows="4" required></textarea>

                    <label for="salaryRange">Salary Range:</label>
                    <input type="text" id="salaryRange" name="salaryRange">
                </div>

                <div class="form-group">
                    <h3>Contact Information</h3>
                    <label for="contactPerson">Contact Person:</label>
                    <input type="text" id="contactPerson" name="contactPerson" required>

                    <label for="contactEmail">Contact Email:</label>
                    <input type="email" id="contactEmail" name="contactEmail" required>

                    <label for="contactPhone">Contact Phone:</label>
                    <input type="tel" id="contactPhone" name="contactPhone">
                </div>

                <div class="form-group">
                    <h3>Additional Information</h3>
                    <label for="postingDuration">Posting Duration (in days):</label>
                    <input type="number" id="postingDuration" name="postingDuration" min="1" required>

                    <label for="companyLogo">Upload Company Logo (optional):</label>
                    <input type="file" id="companyLogo" name="companyLogo" accept="image/*">
                </div>

                <button type="submit" class="submit-btn">Post Job</button>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById('job-posting-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);

            // Send the form data to the server
            try {
                const response = await fetch('/postjob', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('Job posted successfully');
                    form.reset(); // Reset the form after successful submission
                } else {
                    alert('Failed to post job');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while posting the job');
            }
        });
    </script>
</body>
</html>
