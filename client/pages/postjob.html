<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job</title>
    <link rel="stylesheet" href="jobposting.css">
</head>
<body>
    <div class="form-container">
        <h1>Post a Job</h1>
        <form action="#" method="post" enctype="multipart/form-data">
            <!-- Job Information Section -->
            <div class="section">
                <h2>Job Information</h2>
                <label for="job-title">Job Title:</label>
                <input type="text" id="job-title" name="job-title" required placeholder="Enter the job title">

                <label for="company-name">Company Name:</label>
                <input type="text" id="company-name" name="company-name" required placeholder="Enter the company name">

                <label for="location">Job Location:</label>
                <input type="text" id="location" name="location" required placeholder="Enter the job location">
            </div>

            <!-- Job Details Section -->
            <div class="section">
                <h2>Job Details</h2>
                <label for="job-description">Job Description:</label>
                <textarea id="job-description" name="job-description" rows="5" required placeholder="Describe the job responsibilities"></textarea>

                <label for="qualifications">Qualifications:</label>
                <textarea id="qualifications" name="qualifications" rows="4" required placeholder="List the required qualifications"></textarea>

                <label for="salary-range">Salary Range:</label>
                <input type="text" id="salary-range" name="salary-range" placeholder="e.g., $50,000 - $70,000">
            </div>

            <!-- Contact Information Section -->
            <div class="section">
                <h2>Contact Information</h2>
                <label for="contact-person">Contact Person:</label>
                <input type="text" id="contact-person" name="contact-person" required placeholder="Enter the contact person's name">

                <label for="contact-email">Contact Email:</label>
                <input type="email" id="contact-email" name="contact-email" required placeholder="Enter the contact email">

                <label for="contact-phone">Contact Phone:</label>
                <input type="tel" id="contact-phone" name="contact-phone" required placeholder="Enter the contact phone number">
            </div>

            <!-- Job Posting Extras -->
            <div class="section">
                <h2>Additional Information</h2>
                <label for="posting-duration">Posting Duration (in days):</label>
                <input type="number" id="posting-duration" name="posting-duration" min="1" max="365" placeholder="Enter number of days">

                <label for="job-logo">Upload Company Logo (optional):</label>
                <input type="file" id="job-logo" name="job-logo" accept=".jpg,.png,.gif,.svg">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Post Job</button>
        </form>
    </div>
</body>
</html>
