<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="jobapplicationform.css">
</head>
<body>
    <div class="form-container">
        <h1>Job Application Form</h1>
        <form action="/jobapply" method="post" enctype="multipart/form-data">
            <!-- Personal Information Section -->
            <div class="section">
                <h2>Personal Information</h2>
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full-name" required placeholder="Enter your full name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">

                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required placeholder="Enter your address">
            </div>

            <!-- Education Section -->
            <div class="section">
                <h2>Educational Background</h2>
                <label for="degree">Highest Degree:</label>
                <input type="text" id="degree" name="degree" required placeholder="e.g., B.Sc., M.A.">

                <label for="institution">Institution:</label>
                <input type="text" id="institution" name="institution" required placeholder="Name of your institution">

                <label for="grad-year">Year of Graduation:</label>
                <input type="number" id="grad-year" name="grad-year" required min="1950" max="2024" placeholder="YYYY">
            </div>

            <!-- Work Experience Section -->
            <div class="section">
                <h2>Work Experience</h2>
                <label for="company">Last Company Worked:</label>
                <input type="text" id="company" name="company" required placeholder="Enter the last company name">

                <label for="job-title">Job Title:</label>
                <input type="text" id="job-title" name="job-title" required placeholder="Your previous job title">

                <label for="experience-years">Years of Experience:</label>
                <input type="number" id="experience-years" name="experience-years" required min="0" max="50" placeholder="Enter years of experience">
            </div>

            <!-- File Upload Section -->
            <div class="section">
                <h2>Resume Upload</h2>
                <label for="resume">Upload Resume (PDF or DOC):</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
            </div>

            <!-- Additional Information -->
            <div class="section">
                <h2>Additional Information</h2>
                <label for="cover-letter">Cover Letter:</label>
                <textarea id="cover-letter" name="cover-letter" rows="4" placeholder="Write a brief cover letter..."></textarea>

                <label for="comments">Any additional comments:</label>
                <textarea id="comments" name="comments" rows="3" placeholder="Any additional information..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>
</body>
</html>
