<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Alumni Association</title>
  <link rel="stylesheet" href="signup.css" />
  <style>
    :root {
      --button-login-color: #4CAF50;
      --button-signup-color: #f44336;
    }

    .switch-button {
      width: 50px;
      height: 30px;
      position: absolute;
      top: 0;
      left: 105px;
      background-color: var(--button-signup-color);
      transition: left 0.3s, background-color 0.3s;
      z-index: -1;
      border-radius: 5px;
    }

    .switch-text {
      font-weight: normal;
      cursor: pointer;
    }

    .switch-text.active {
      font-weight: bold;
      color: var(--button-signup-color);
    }

    .switch-container {
      display: flex;
      justify-content: space-between;
      width: 200px;
      position: relative;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="branding">
        <h1><span class="highlight">Alumni</span> Association</h1>
      </div>
      <nav>
        <ul>
          <li><a href="alumini.html">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#">Events</a></li>
          <li><img src="User_Profile.png" alt="profile" /></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-switch">
      <div class="switch-container">
        <div class="switch-text login" id="loginText" > Login</a></div>
        <div class="switch-text signup active" id="signupText">Sign Up</div>
        <div class="switch-button" id="switchButton"></div>
      </div>
    </div>

    <section class="signup-section">
      <div class="container">
        <div class="signup-form-container">
          <h2>Sign Up</h2>
          <form action="/signup" method="post">
            <div class="form-group">
              <label for="username">Username/Mobile no.</label>
              <input type="text" id="username" name="username" required />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm Password</label>
              <input type="password" id="confirm-password" name="confirm-password" required />
            </div>
            <div class="form-group">
              <label for="userType">User Type</label>
              <select id="userType" name="userType" required>
                <option value="">Select</option>
                <option value="alumni">Alumni</option>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
              </select>
            </div>
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" required />
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" required />
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" required />
            </div>
            <div class="form-group">
              <button type="submit">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Alumni Association Platform. All rights reserved.</p>
  </footer>

  <script src="login_singup.js"></script>
</body>
</html>
