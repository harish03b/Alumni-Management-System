<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Association - Payment Options</title>
    <style>
        /* Reset & Base Styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
        }

        /* Navbar Styling */
        header {
            background-color: #003366;
            padding: 20px 0;
        }

        header h1 {
            color: orange;
            font-size: 32px;
            font-weight: bold;
            margin: 0;
            padding-left: 30px;
        }

        nav {
            background-color: #003366;
            display: flex;
            justify-content: flex-end;
            padding: 10px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 18px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Page Layout */
        .container {
            width: 100%;
        }

        /* Main Content Styling */
        .content {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Heading */
        .content h2 {
            background: linear-gradient(to bottom, #daa520, #8b6c3c);
            color: white;
            font-size: 26px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        /* Payment Option Styling */
        .payment-option {
            background-color: #003366;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-align: left;
        }

        .payment-option:hover {
            background-color: #0051a1;
        }

        /* Submit Button Styling */
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #003366;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            background-color: #002244;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Alumni Association</h1>
        </header>
        <nav>
            <a href="alumini.html">Home</a>
            <a href="#">Directory</a>
            <a href="#">Contact</a>
            <a href="#">Event</a>
        </nav>
        <div class="content">
            <h2>Choose payment option</h2>
            <form id="paymentForm">
                <div class="payment-option">
                    <label>
                        <input type="radio" name="paymentMethod" value="Bank Transfer" checked>
                        Bank Transfer
                    </label>
                </div>
                <div class="payment-option">
                    <label>
                        <input type="radio" name="paymentMethod" value="Card">
                        Pay using card
                    </label>
                </div>
                <div class="payment-option">
                    <label>
                        <input type="radio" name="paymentMethod" value="Online Pay">
                        Online pay
                    </label>
                </div>
                <button type="submit">Next</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent form submission

            // Get payment method
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

            // Get donor info and amount from localStorage
            const firstName = localStorage.getItem('firstName');
            const lastName = localStorage.getItem('lastName');
            const email = localStorage.getItem('email');
            const amount = localStorage.getItem('donationAmount');

            // Check if data exists
            if (!firstName || !lastName || !email || !amount) {
                alert('Please ensure all donor information is provided.');
                return;
            }

            // Get the current date
            const currentDate = new Date().toISOString(); // Get date in ISO format

            // Send data to the server
            fetch('/donate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName, lastName, email, amount, paymentMethod, date: currentDate })
            })
            .then(response => {
    if (!response.ok) {
        throw new Error('Server returned an error');
    }
    return response.json();
})
.then(data => {
    // Treat anything that contains 'Donation successful' as success
    if (data.message && data.message.includes('Donation successful')) {
        localStorage.setItem('pdfPath', data.pdfPath);
        window.location.href = 'popup.html';
    } else {
        alert('Unexpected response: ' + data.message);
    }
})

            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            });
        });
    </script>
</body>
</html>
