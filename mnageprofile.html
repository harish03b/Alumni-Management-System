<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management - Privacy Settings</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Profile Management (Privacy Settings)</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">Directory</a>
                <a href="#">Contact</a>
                <a href="#">Events</a>
            </nav>
        </header>

        <section class="privacy-settings">
            <h2>Privacy Setting Configuration</h2>
            <div class="profile-section">
                <img src="profile-placeholder.png" alt="Profile Image" class="profile-img">
                <p>Profile Image</p>
            </div>
            
            <form>
                <fieldset>
                    <legend>Profile Visibility:</legend>
                    <label>
                        <input type="radio" name="visibility" value="public" checked> Public
                    </label>
                    <label>
                        <input type="radio" name="visibility" value="network"> Network Only
                    </label>
                    <label>
                        <input type="radio" name="visibility" value="private"> Private
                    </label>
                </fieldset>
                
                <button type="submit" class="save-btn">Save Changes</button>
            </form>
        </section>

        <footer>
            <p>All rights reserved</p>
        </footer>
    </div>
</body>
</html>
